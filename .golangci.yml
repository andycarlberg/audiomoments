version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G304

formatters:
  enable:
    - gofmt
